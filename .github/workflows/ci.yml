name: CI

on:
  pull_request:
    branches: [main]

# No token scopes by default; the one job below opts into exactly what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, check, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    env:
      HUSKY: "0"
      # Read by prisma.config.ts and never connected to — generate and build touch no database.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci

    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Leave no usable credential in .git/config for any later step to pick up.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The client is gitignored, so nothing typechecks or builds until it exists.
      - name: Generate the Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint:check

      - name: Svelte and type check
        run: npm run check

      - name: Build
        run: npm run build
